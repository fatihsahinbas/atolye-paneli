{% extends "base.html" %}
{% block content %}
<h1>Yeni sipariş</h1>
{% if not customers or not products %}
<div class="card">
  <p>Sipariş açmak için önce en az bir <a href="/musteriler">müşteri</a> ve bir <a href="/urunler">ürün</a> ekleyin.</p>
</div>
{% else %}
<form method="post" action="/siparisler" class="card stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Müşteri
    <select name="customer_id" required>
      {% for c in customers %}<option value="{{ c.id }}">{{ c.full_name }}</option>{% endfor %}
    </select>
  </label>
  <div class="grid2">
    <label>Ürün
      <select name="product_id" required id="product">
        {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    <label>Adet <input type="number" name="quantity" value="1" min="1" max="1000" required></label>
  </div>
  <div id="price" class="price-box muted">Fiyat hesaplanıyor…</div>
  <label>Kişiselleştirme / açıklama <input name="description" maxlength="200" placeholder="Ör. iç yüzüğe 'E & M 2026' gravür"></label>
  <label>Termin <input type="date" name="due_date"></label>
  <label>Not <textarea name="note" rows="3" maxlength="2000"></textarea></label>
  <button class="primary">Siparişi oluştur</button>
</form>
<script src="/static/js/app.js" defer></script>
{% endif %}
{% endblock %}
