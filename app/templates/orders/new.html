{% extends "base.html" %}

{% block content %}
<h1>Yeni sipariş</h1>

{% if not customers or not products %}
<div class="card">
    <p>
        Sipariş açmak için önce en az bir
        <a href="/musteriler">müşteri</a> ve bir
        <a href="/urunler">ürün</a> ekleyin.
    </p>
</div>
{% else %}

<form method="post" action="/siparisler" class="card stack">

    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label>Müşteri
        <select name="customer_id" required>
            {% for c in customers %}
                <option value="{{ c.id }}">{{ c.full_name }}</option>
            {% endfor %}
        </select>
    </label>

    <h3>Sipariş kalemleri</h3>

    <div id="order-items">
        {% include "orders/_item_row.html" %}
    </div>

    <button
        type="button"
        hx-get="/siparisler/kalem/yeni"
        hx-target="#order-items"
        hx-swap="beforeend">
        + Kalem ekle
    </button>

    <div
        id="order-total"
        class="price-box muted"
        hx-post="/siparisler/fiyat-onizleme"
        hx-trigger="recalculate"
        hx-include="#order-items"
        hx-target="#order-total"
        hx-swap="innerHTML">
        Toplam hesaplanıyor...
    </div>

    <label>Termin
        <input type="date" name="due_date">
    </label>

    <label>Not
        <textarea name="note" rows="3" maxlength="2000"></textarea>
    </label>

    <button type="submit" class="primary">
        Siparişi oluştur
    </button>

</form>

<script src="/static/js/app.js" defer></script>

{% endif %}
{% endblock %}
