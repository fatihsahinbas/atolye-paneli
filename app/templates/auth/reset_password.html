{% extends "base.html" %}
{% block title %}Şifre yenile · {{ APP_NAME }}{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Yeni şifre oluştur</h1>
  {% if invalid %}<p class="alert">Bağlantı geçersiz, kullanılmış veya süresi dolmuş.</p>
  <a href="/sifremi-unuttum">Yeni bağlantı iste</a>
  {% else %}
  <form method="post" action="/sifre-yenile" class="stack">
    <input type="hidden" name="reset_csrf" value="{{ reset_csrf }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>Yeni şifre <input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <label>Yeni şifre (tekrar) <input type="password" name="password_confirm" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <button class="primary">Şifremi yenile</button>
  </form>
  {% endif %}
</div>
{% endblock %}
