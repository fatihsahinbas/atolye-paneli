<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body {% if csrf_token %}hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  {% if user %}
  <header class="topbar">
    <a href="/" class="brand" aria-label="{{ APP_NAME }} ana sayfa">
      <img src="/static/img/logo.svg" alt="">{{ APP_NAME }}
    </a>
    <nav>
      <a href="/">Pano</a>
      <a href="/siparisler/yeni">Yeni sipariş</a>
      <a href="/musteriler">Müşteriler</a>
      {% if user.role.value == "OWNER" %}<a href="/personel">Personel</a>{% endif %}
      <a href="/urunler">Ürünler</a>
      <a href="/v/{{ user.workshop.slug }}" target="_blank" rel="noopener">Vitrin ↗</a>
    </nav>
    <div class="who">
      <a href="/hesap">{{ user.full_name }}</a>
      <form method="post" action="/cikis" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link">Çıkış</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
