<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Atölye Paneli{% endblock %}</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body {% if csrf_token %}hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  {% if user %}
  <header class="topbar">
  <a href="/" class="brand" aria-label="Atölye Paneli Ana Sayfa">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Pırlanta / Elmas Kesimi -->
    <path d="M6 3h12l4 6-10 12L2 9l4-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M2 9h20M8 9l4 12M16 9l-4 12M6 3l2 6M18 3l-2 6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
  Atölye Paneli
</a>
    <nav>
      <a href="/">Pano</a>
      <a href="/siparisler/yeni">Yeni sipariş</a>
      <a href="/musteriler">Müşteriler</a>
      {% if user.role.value == "OWNER" %}<a href="/personel">Personel</a>{% endif %}
      <a href="/urunler">Ürünler</a>
      <a href="/v/{{ user.workshop.slug }}" target="_blank" rel="noopener">Vitrin ↗</a>
    </nav>
    <div class="who">
      <a href="/hesap">{{ user.full_name }}</a>
      <form method="post" action="/cikis" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link">Çıkış</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
