[project]
name = "atolye-paneli"
version = "0.1.0"
description = "Kişiye özel üretim yapan atölyeler için sipariş, üretim takibi ve vitrin"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning"]

[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Form() varsayılan argümanda kullanılır
