# Production: Caddy (HTTPS) → app (FastAPI) → db (PostgreSQL)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atolye
      POSTGRES_USER: atolye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    # Dışarıya port AÇILMAZ; yalnızca app erişir

  app:
    build: .
    env_file: .env
    volumes: [media:/srv/var/media]
    depends_on: [db]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
